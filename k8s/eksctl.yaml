apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${cluster_name}
  region: ${region}
  version: "1.35"

vpc:
  subnets:
    public:
      ${az_a}:
        id: ${subnet_a}
      ${az_b}:
        id: ${subnet_b}

managedNodeGroups:
  - name: ${cluster_name}-ng
    instanceType: ${node_instance_type}
    amiFamily: Bottlerocket
    minSize: 1
    maxSize: 4
    desiredCapacity: 1
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
    labels:
      role: worker
    tags:
      Name: ${cluster_name}-node
    iam:
      withAddonPolicies:
        albIngress: true
        cloudWatch: true

iam:
  withOIDC: true
