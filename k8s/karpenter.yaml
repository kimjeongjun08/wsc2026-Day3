apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name}-pool
spec:
  template:
    metadata:
      labels:
        role: worker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${name}-nodeclass
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # 버스트 노드는 spot 우선(비용 ~70%↓, 성능 동일) + on-demand 폴백(spot 없을 때).
        #   baseline은 MNG 2대(on-demand 고정)라 안정 유지 → spot 중단돼도 서비스 지속.
        #   spot 리스크(중단) 싫으면 values를 ["on-demand"]로 되돌리면 됨.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${node_instance_type}"]
      expireAfter: 720h
  limits:
    cpu: "6"
    memory: 12Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ${name}-nodeclass
spec:
  role: KarpenterNodeRole-${cluster_name}
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - id: ${subnet_a}
    - id: ${subnet_b}
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": "${cluster_name}"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
