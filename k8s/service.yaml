apiVersion: v1
kind: Service
metadata:
  name: user-svc
  namespace: apdev
spec:
  type: NodePort
  selector:
    app: user
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
  namespace: apdev
spec:
  type: NodePort
  selector:
    app: product
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30002
---
apiVersion: v1
kind: Service
metadata:
  name: stress-svc
  namespace: apdev
spec:
  type: NodePort
  selector:
    app: stress
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30003
