# ⚠️ 비활성/미사용 사본. 실제 배포 매니페스트는 terraform/k8s/ 이다.
# (terraform → S3 업로드 → bastion 다운로드 → setup.sh apply). 이 디렉터리(k8s/)는
# 어디서도 참조되지 않으므로 수정해도 효과 없음. 운영/채점 변경은 terraform/k8s/ 에서.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-hpa
  namespace: apdev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 10
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
