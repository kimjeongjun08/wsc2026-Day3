apiVersion: v1
kind: Namespace
metadata:
  name: apdev
  labels:
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: user
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: high-priority
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user
      containers:
        - name: user
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/apdev-user:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
---
