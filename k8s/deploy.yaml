apiVersion: v1
kind: Namespace
metadata:
  name: apdev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: user
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: high-priority
      # stress 노드엔 안 앉음(stress가 노드 독차지 → 코어 경합 0, stress 30%↑ 유지).
      affinity:
        # ① MNG(상시 켜진 노드) 선호 — MNG = karpenter.sh/nodepool 라벨이 없는 노드.
        # ★nodeAffinity 제거: DoesNotExist를 쓰면 Karpenter가 노드 생성을 건너뛴다 (실측).
        #   MNG 선호는 불필요 — 스케줄러가 request 작은 파드를 빈 자리에 자연스럽게 넣는다.
        # ★stress와는 절대 같은 노드에 앉지 않는다 (required).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["stress"]
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      # ★maxSkew 1: 파드를 노드에 균등 분산.
      #   같은 파드 수에서 27pods/node면 p50 174ms, 13pods/node면 71ms (실측).
      #   분산하면 파드당 부하가 줄어 p95가 내려간다 → user 성능 ↑
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user
      containers:
        - name: user
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/apdev-user:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 20
            periodSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          # ★38점 구성의 최적값.
          #   requests.cpu 70m × HPA target 33% = 트리거 23m
          #   → "파드 CPU가 23m을 넘으면 증설". io 요청 하나가 ~19m·s이므로
          #     '동시 요청 1.2개'에서 늘어난다 = 큐가 생기기 시작하는 지점.
          #   ★CPU limit을 두지 않는다: io 앱은 CPU를 짧게 burst로 쓰는데(대부분 DB 대기)
          #     limit이 있으면 그 순간 CFS 스로틀이 걸려 p95가 그대로 올라간다.
          #     실측 — limit 없음 96.8% / limit 1259m 78.9%.
          #   ★request 70m이면 MNG(앱 가용 ~1278m)에 18파드가 들어간다.
          #     그 구간은 상시 켜진 노드라 노드 비용이 0이다 → 스파이크를 노드 없이 흡수.
          resources:
            requests:
              cpu: 70m
              memory: 48Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: product
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: high-priority
      # stress 노드엔 안 앉음(stress가 노드 독차지 → 코어 경합 0, stress 30%↑ 유지).
      affinity:
        # ① MNG(상시 켜진 노드) 선호 — MNG = karpenter.sh/nodepool 라벨이 없는 노드.
        # ★nodeAffinity 제거: DoesNotExist를 쓰면 Karpenter가 노드 생성을 건너뛴다 (실측).
        #   MNG 선호는 불필요 — 스케줄러가 request 작은 파드를 빈 자리에 자연스럽게 넣는다.
        # ② user·product는 서로 같은 노드에 모인다 (podAffinity).
        #   ★근거: 둘 다 request가 작고(70m) CPU limit이 없어 한 노드에 수십 개가 들어간다.
        #     흩어지면 각자 노드를 차지해 같은 파드 수인데 노드가 늘어난다(비용 손실).
        #     MNG를 넘어 Karpenter 노드로 갈 때도 '함께' 가야 노드 하나를 공유한다.
        # ★stress와는 절대 같은 노드에 앉지 않는다 (required).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["stress"]
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product
      containers:
        - name: product
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/apdev-product:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 20
            periodSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          # ★38점 구성의 최적값.
          #   requests.cpu 70m × HPA target 33% = 트리거 23m
          #   → "파드 CPU가 23m을 넘으면 증설". io 요청 하나가 ~19m·s이므로
          #     '동시 요청 1.2개'에서 늘어난다 = 큐가 생기기 시작하는 지점.
          #   ★CPU limit을 두지 않는다: io 앱은 CPU를 짧게 burst로 쓰는데(대부분 DB 대기)
          #     limit이 있으면 그 순간 CFS 스로틀이 걸려 p95가 그대로 올라간다.
          #     실측 — limit 없음 96.8% / limit 1259m 78.9%.
          #   ★request 70m이면 MNG(앱 가용 ~1278m)에 18파드가 들어간다.
          #     그 구간은 상시 켜진 노드라 노드 비용이 0이다 → 스파이크를 노드 없이 흡수.
          resources:
            requests:
              cpu: 70m
              memory: 48Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stress
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: normal-priority
      # ★stress: nodeAffinity 없음. MNG에도 앉을 수 있다.
      #   priority가 낮아(500) user/product(1000)가 preempt 가능 → 역전 걱정 없음.
      #   평시: MNG에 stress가 앉아 노드 1대로 운영 (비용 최소).
      #   스파이크: user/product가 MNG를 필요로 하면 stress를 밀어냄 → Karpenter로 이동.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["user", "product", "stress"]
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      # topologySpread 없음 — 위 required anti-affinity가 '노드당 1파드'를 보장한다.
      #   maxSkew는 soft라 자리가 없으면 뭉치므로 이 앱에는 부족하다.
      containers:
        - name: stress
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/apdev-stress:latest
          ports:
            - containerPort: 8080
          env:
            # limit 1800m = t3.medium 2코어 → 앱이 병렬화 (length125: 1코어 3.1s → 2코어 1.5s)
            - name: GOMAXPROCS
              value: "2"
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 20
            periodSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            failureThreshold: 5
          # stress: 앱이 병렬화됨 → limit 2000m(2코어 전부) + GOMAXPROCS 2로 단건 최대 속도.
          # request 작게(비용) + 노드당 1파드(과밀·starvation 방지). turn.py가 실측으로 재조정.
          resources:
            requests:
              cpu: 600m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 512Mi

