apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000
globalDefault: false
description: "user/product - 높은 우선순위"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: normal-priority
value: 500
globalDefault: true
description: "stress - 일반 우선순위 (리소스 부족 시 먼저 퇴거)"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: pause-priority
value: -10
globalDefault: false
description: "overprovisioning - 최저 우선순위. stress가 오면 즉시 쫓겨남(preempted) → warm node 효과"