---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stress
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: normal-priority
      # ★stress 전용 노드풀(taint workload=stress)에만 앉는다 — karpenter.yaml 참고.
      #   CFS 는 requests 비율로 CPU 를 나눈다(stress 600m : user 70m ≈ 8.6:1) →
      #   같은 노드에 두면 부하가 몰릴 때 user 가 굶는다. 격리 가치는 부하가 클수록 커진다.
      #   anti-affinity 가 아니라 taint 로 격리하는 이유: user/product 의 topologySpread 가
      #   nodeTaintsPolicy: Honor 로 이 노드를 도메인 계산에서 제외할 수 있기 때문이다.
      #   (anti-affinity 는 도메인에서 제외되지 않아 "0개 도메인" 이 되어 노드가 무한 증식한다)
      nodeSelector:
        role: stress
      tolerations:
        - key: workload
          value: stress
          effect: NoSchedule
          operator: Equal
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      # topologySpread 없음 — 전용 노드풀이라 user/product 와 섞이지 않는다.
      containers:
        - name: stress
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/PROJECT-stress:latest
          ports:
            - containerPort: 8080
          env:
            # limit 1800m = t3.medium 2코어 → 앱이 병렬화 (length125: 1코어 3.1s → 2코어 1.5s)
            - name: GOMAXPROCS
              value: "2"
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # 기동 판정. 여기서 여유를 주면 롤아웃 중 미완성 파드가 트래픽을 받지 않는다.
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 20
            periodSeconds: 1
            timeoutSeconds: 3
          # ★timeoutSeconds 를 명시한다. 안 쓰면 쿠버네티스 기본값이 1초다.
          #   실측에서 피크 구간 노드 CPU 가 93~100% 였다. 그 상태에서는 /healthcheck
          #   응답도 1초를 넘길 수 있고, 그러면 멀쩡한 파드가 2초 만에 ALB 에서 빠진다.
          #   용량이 제일 필요한 순간에 용량이 줄고, 남은 파드로 부하가 몰려 연쇄된다.
          #   그러면 '성능 손실'(앱당 최대 4점)이 '가용성 손실'(앱당 4점 + 5xx)로 번진다.
          #   ALB 쪽 판정(timeout 3s / interval 5s / 2회 = 약 10초)보다는 여전히 빠르게
          #   잡도록 3초 × 3회 = 약 9초로 둔다. 진짜 죽은 파드는 ALB 보다 먼저 뺀다.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # ★리브니스 실패는 컨테이너 재시작이다 — 처리 중이던 요청이 통째로 날아간다.
          #   바쁜 것과 죽은 것을 구분해야 한다. 여기도 기본 1초 타임아웃이면
          #   포화 구간에서 '바쁜 파드'를 죽인다. 5초로 늘린다.
          #   30초 × 5회 = 150초 동안 계속 실패해야 재시작한다.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # stress: 앱이 병렬화됨 → limit 2000m(2코어 전부) + GOMAXPROCS 2로 단건 최대 속도.
          # request 작게(비용) + 노드당 1파드(과밀·starvation 방지). turn.py가 실측으로 재조정.
          resources:
            requests:
              cpu: 600m
              memory: 128Mi
            limits:
              cpu: 2000m
              memory: 512Mi

