apiVersion: v1
kind: Namespace
metadata:
  name: apdev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: apdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: user
    spec:
      terminationGracePeriodSeconds: 35
      priorityClassName: high-priority
      # ★stress 격리는 taint 로 한다(karpenter.yaml 의 stress 전용 NodePool).
      #   podAntiAffinity 로 막으면 stress 노드가 topologySpread 에서 "영원히 0개인 도메인" 으로
      #   남아 maxSkew 를 계속 위반한다 → DoNotSchedule 과 함께 쓰면 노드가 무한 증식한다.
      #   taint 면 nodeTaintsPolicy: Honor 가 그 노드를 도메인 계산에서 아예 제외한다.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      # ★maxSkew 1: 파드를 노드에 균등 분산.
      #   같은 파드 수에서 27pods/node면 p50 174ms, 13pods/node면 71ms (실측).
      #   분산하면 파드당 부하가 줄어 p95가 내려간다 → user 성능 ↑
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # ★DoNotSchedule: ScheduleAnyway 는 "가능하면" 이라 자리가 있으면 그냥 쌓인다.
          #   실측(x0.5, 동일 클러스터): ScheduleAnyway → 18pods/node, p50 192ms, 35.0점
          #                              DoNotSchedule  → 11pods/node, p50  93ms, 38.0점
          #   Karpenter 는 requests 합계만 보므로 CPU 가 남으면 노드를 안 부른다 →
          #   강제하지 않으면 밀도가 부하에 비례해 그대로 올라간다.
          whenUnsatisfiable: DoNotSchedule
          # taint 걸린 stress 노드를 도메인 계산에서 제외한다.
          nodeTaintsPolicy: Honor
          # ★minDomains 2: 도메인(=스케줄 가능한 노드)이 1개뿐이면 skew 는 항상 0 이라
          #   DoNotSchedule 이 아무것도 막지 못한다 → 파드가 Pending 되지 않고 한 노드에 쌓인다.
          #   Karpenter 는 Pending 파드를 보고 움직이므로, 그때까지 노드를 만들지 않는다.
          #   실측(x0.5, MNG desired=1): 스파이크 진입 후 3분간 1노드에 user 12개 →
          #     up50 176ms, user 성능 80% (2점 손실). 노드는 뒤늦게 3분 후에야 추가됐다.
          #   minDomains 2 면 도메인이 부족할 때 파드를 즉시 Pending 시켜 Karpenter 를 깨운다.
          #   부하 크기를 미리 알 필요가 없다 — 스케줄러가 알아서 하한을 강제한다.
          minDomains: 2
          labelSelector:
            matchLabels:
              app: user
      containers:
        - name: user
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/PROJECT-user:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          # 기동 판정. 여기서 여유를 주면 롤아웃 중 미완성 파드가 트래픽을 받지 않는다.
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            failureThreshold: 20
            periodSeconds: 1
            timeoutSeconds: 3
          # ★timeoutSeconds 를 명시한다. 안 쓰면 쿠버네티스 기본값이 1초다.
          #   실측에서 피크 구간 노드 CPU 가 93~100% 였다. 그 상태에서는 /healthcheck
          #   응답도 1초를 넘길 수 있고, 그러면 멀쩡한 파드가 2초 만에 ALB 에서 빠진다.
          #   용량이 제일 필요한 순간에 용량이 줄고, 남은 파드로 부하가 몰려 연쇄된다.
          #   그러면 '성능 손실'(앱당 최대 4점)이 '가용성 손실'(앱당 4점 + 5xx)로 번진다.
          #   ALB 쪽 판정(timeout 3s / interval 5s / 2회 = 약 10초)보다는 여전히 빠르게
          #   잡도록 3초 × 3회 = 약 9초로 둔다. 진짜 죽은 파드는 ALB 보다 먼저 뺀다.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 1
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # ★리브니스 실패는 컨테이너 재시작이다 — 처리 중이던 요청이 통째로 날아간다.
          #   바쁜 것과 죽은 것을 구분해야 한다. 여기도 기본 1초 타임아웃이면
          #   포화 구간에서 '바쁜 파드'를 죽인다. 5초로 늘린다.
          #   30초 × 5회 = 150초 동안 계속 실패해야 재시작한다.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # ★38점 구성의 최적값.
          #   requests.cpu 70m × HPA target 33% = 트리거 23m
          #   → "파드 CPU가 23m을 넘으면 증설". io 요청 하나가 ~19m·s이므로
          #     '동시 요청 1.2개'에서 늘어난다 = 큐가 생기기 시작하는 지점.
          #   ★CPU limit을 두지 않는다: io 앱은 CPU를 짧게 burst로 쓰는데(대부분 DB 대기)
          #     limit이 있으면 그 순간 CFS 스로틀이 걸려 p95가 그대로 올라간다.
          #     실측 — limit 없음 96.8% / limit 1259m 78.9%.
          #   ★request 70m이면 MNG(앱 가용 ~1278m)에 18파드가 들어간다.
          #     그 구간은 상시 켜진 노드라 노드 비용이 0이다 → 스파이크를 노드 없이 흡수.
          resources:
            requests:
              cpu: 70m
              memory: 48Mi
            limits:
              memory: 256Mi
---
