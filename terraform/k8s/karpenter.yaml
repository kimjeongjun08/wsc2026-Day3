apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name}-pool
spec:
  template:
    metadata:
      labels:
        role: worker
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${name}-nodeclass
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${node_instance_type}"]
      expireAfter: 720h
  # 하드캡: 카펜터 노드 5대분 (t3.medium 2vCPU × 5) — 총 노드 = MNG 2 + 5 = 7
  limits:
    cpu: "10"
    memory: 20Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 20s
    budgets:
      - nodes: "100%"
# stress 격리는 별도 노드풀(taint) 대신 deploy.yaml의 pod anti-affinity로 처리 →
#   stress가 user/product와 같은 노드에 못 앉아 노드를 독차지(2코어 확보). 단일 풀로 baseline 2대 유지.
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ${name}-nodeclass
spec:
  role: KarpenterNodeRole-${cluster_name}
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - id: ${subnet_a}
    - id: ${subnet_b}
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": "${cluster_name}"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        deleteOnTermination: true
  metadataOptions:
    httpPutResponseHopLimit: 2
    httpTokens: required
