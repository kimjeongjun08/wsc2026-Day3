---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stress-hpa
  namespace: apdev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stress
  # stress는 anti-affinity로 파드당 노드1 → min=2면 전용노드 2대=baseline 3(ratio↑). baseline 2 정책상 min=1.
  #   부하 시 HPA가 max까지 확장(각자 새 노드). turn.py가 실측으로 재확정.
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 30          # 보수적 (요요 방지)
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # util 70%: 노드당 1파드라 부하 늘면 노드 추가로 대응
          averageUtilization: 55
