# overprovisioning.yaml — Karpenter warm pool 대체
# 빈 pause 파드를 Karpenter 노드에 올려서 노드를 미리 확보.
# stress 파드(priority 500)가 스케줄 요청하면 pause(priority -10)를 preempt → 즉시 배치.
# scaler가 replicas를 동적으로 조절: 트래픽 상승 시 올리고, 트래픽 없을 때 0으로 → 비용 보호.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioning
  namespace: apdev
spec:
  replicas: 0  # 초기값 0. scaler/예열 툴이 동적으로 조절.
  selector:
    matchLabels:
      app: overprovisioning
  template:
    metadata:
      labels:
        app: overprovisioning
      annotations:
        # ★Karpenter가 이 warm 노드를 "저활용"으로 보고 consolidate/축출하지 않게 고정.
        #   (1900m으로 노드를 거의 꽉 채워 대부분 방어되지만, drift/재평가 대비 belt-and-suspenders.
        #    stress의 preempt는 kube-scheduler 동작이라 이 애노테이션과 무관하게 정상 작동함.)
        karpenter.sh/do-not-disrupt: "true"
    spec:
      priorityClassName: pause-priority
      terminationGracePeriodSeconds: 0
      nodeSelector:
        role: worker  # Karpenter 노드에만
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1500m   # t3.medium alloc 1930m 에서 DaemonSet(약 150m) 을 뺀 여유 안. 1900m 로 두면
              #   Karpenter 시뮬레이션이 1900+150=2050m 가 되어 어떤 노드에도 안 들어가고
              #   증설이 영원히 실패한다(실측 2026-08-24).
              memory: 128Mi
            limits:
              cpu: 1500m
              memory: 128Mi
